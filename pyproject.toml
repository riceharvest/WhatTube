[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whattube"
version = "0.2.0"
description = "Sparse real-time foreign chatter detection, transcription, and translation overlay for YouTube."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dario", email = "myappleiddarimaan@gmail.com" }]
dependencies = [
    "websockets>=12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "sherpa-onnx>=1.10.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "torch>=2.1.0",
    "ctranslate2>=4.0.0",
    "scipy>=1.10.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
whattube-server = "whattube.server:main"
whattube-daemon = "whattube.asr.resident_daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whattube*"]
